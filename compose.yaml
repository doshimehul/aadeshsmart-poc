services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aadeshsmart-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aadeshsmart}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - recordings_data:/app/storage/recordings

  db:
    image: postgres:16-alpine
    container_name: aadeshsmart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aadeshsmart}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aadeshsmart}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  recordings_data:
